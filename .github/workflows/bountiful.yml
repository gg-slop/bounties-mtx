---
name: "DAG Hunt"
on:
  push:
    branches: [master]
    paths: ["*/deltas/*.claim.json"]
concurrency:
  group: bounty-ledger
  cancel-in-progress: false
permissions: {}
env:
  # The commit of rezzy whose C ABI checks every event; bump it deliberately.
  REZZY_SHA: 48adad07e9ebe63a377568e89da574e502a284f4
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Runs in this concurrency group may have queued behind a prior
          # ledger push. Start from the current branch so the award run sees it.
          ref: master
          fetch-depth: 0
          # The rezzy build below runs third-party build scripts: keep the
          # write-scoped token out of .git/config until the push step.
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/rezzy
          ref: ${{ env.REZZY_SHA }}
          path: rezzy
          persist-credentials: false
      - name: Build librezzy_ffi from the pinned commit
        run: |
          set -euo pipefail
          test "$(git -C rezzy rev-parse HEAD)" = "$REZZY_SHA"
          test -z "$(git -C rezzy status --porcelain)"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          (cd rezzy && RUSTUP_TOOLCHAIN=1.88.0 cargo build --release --locked -p rezzy-ffi)
          echo "REZZY_LIB=$GITHUB_WORKSPACE/rezzy/target/release/librezzy_ffi.so" >> "$GITHUB_ENV"
      - name: Award claims in merge order
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "$PUSH_BEFORE"
          python3 -I scripts/bounty.py award --before "$PUSH_BEFORE" \
            --repo "$REPOSITORY" --errors "$RUNNER_TEMP/claim-errors.txt"
      - name: Commit and push ledger updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          shopt -s nullglob
          for ledger in */ledger.jsonl; do
            git add -- "$ledger"
          done
          if ! git diff --cached --quiet; then
            git -c user.name=claim-bot -c user.email=bot@invalid \
              commit -qm "Record bounty awards"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:refs/heads/master; then
                pushed=true
                break
              fi
              git rebase --abort || true
            done
            if [[ "$pushed" != true ]]; then
              echo "could not push ledger after three fetch/rebase attempts" >&2
              exit 1
            fi
          fi
      - name: Report invalid claims after persisting valid awards
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/claim-errors.txt" ]]; then
            cat "$RUNNER_TEMP/claim-errors.txt"
            exit 1
          fi
