---
name: "DAG Hunt"
# Three jobs, three trust levels. Data moves between them only as artifacts.
#   resolve  credentials to read PRs; runs no rezzy and builds nothing
#   replay   builds and runs rezzy; no credentials of any kind
#   publish  the only job that can write to master; builds and runs no rezzy,
#            and accepts nothing from replay but validated, append-only ledgers
on:
  push:
    branches: [master]
    paths: ["*/deltas/*.claim.json"]
concurrency:
  group: bounty-ledger
  cancel-in-progress: false
permissions: {}
env:
  # The commit of rezzy whose C ABI checks every event; bump it deliberately.
  REZZY_SHA: 48adad07e9ebe63a377568e89da574e502a284f4
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Runs in this concurrency group may have queued behind a prior
          # ledger push. Start from the current branch so the run sees it.
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve claim attribution and pre-push tables
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "$PUSH_BEFORE"
          python3 -I scripts/bounty_award.py resolve --before "$PUSH_BEFORE" \
            --repo "$REPOSITORY" --out "$RUNNER_TEMP/resolved.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved.json
          retention-days: 1

  replay:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/rezzy
          ref: ${{ env.REZZY_SHA }}
          path: rezzy
          persist-credentials: false
      - name: Build librezzy_ffi from the pinned commit
        run: |
          set -euo pipefail
          test "$(git -C rezzy rev-parse HEAD)" = "$REZZY_SHA"
          test -z "$(git -C rezzy status --porcelain)"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          (cd rezzy && RUSTUP_TOOLCHAIN=1.88.0 cargo build --release --locked -p rezzy-ffi)
          echo "REZZY_LIB=$GITHUB_WORKSPACE/rezzy/target/release/librezzy_ffi.so" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved
      - name: Replay claims in merge order
        run: |
          set -euo pipefail
          python3 -I scripts/bounty_award.py replay \
            --resolved "$RUNNER_TEMP/resolved/resolved.json" --out award-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: award-out
          path: award-out
          retention-days: 1

  publish:
    needs: [resolve, replay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: award-out
          path: ${{ runner.temp }}/award-out
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: resolved
          path: ${{ runner.temp }}/resolved
      - name: Validate the staged ledgers
        run: |
          set -euo pipefail
          # Standard library only, run from the checked-out master. Accepts
          # nothing but append-only unpaid ledger rows for published rooms that
          # the resolve job's metadata and the target tables back.
          python3 -I scripts/bounty_award.py publish \
            --src "$RUNNER_TEMP/award-out" \
            --resolved "$RUNNER_TEMP/resolved/resolved.json" \
            --errors "$RUNNER_TEMP/claim-errors.txt"
      - name: Commit and push ledger updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          shopt -s nullglob
          for ledger in */ledger.jsonl; do
            git add -- "$ledger"
          done
          if [[ -f bounty-processed.json ]]; then
            git add -- bounty-processed.json
          fi
          if ! git diff --cached --quiet; then
            git -c user.name=claim-bot -c user.email=bot@invalid \
              commit -qm "Record bounty awards"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:refs/heads/master; then
                pushed=true
                break
              fi
              git rebase --abort || true
            done
            if [[ "$pushed" != true ]]; then
              echo "could not push ledger after three fetch/rebase attempts" >&2
              exit 1
            fi
          fi
      - name: Report invalid claims after persisting valid awards
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/claim-errors.txt" ]]; then
            cat "$RUNNER_TEMP/claim-errors.txt"
            exit 1
          fi
