name: claim
on:
  pull_request:
    paths: ["*/submissions/*.jsonl.b64"]
  pull_request_target:
    paths: ["*/submissions/*.jsonl.b64"]
permissions: {}
env:
  # The commit of rezzy whose C ABI checks every event; bump it deliberately.
  REZZY_SHA: 48adad07e9ebe63a377568e89da574e502a284f4
jobs:
  validate-fork-or-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: res
          persist-credentials: false
      - name: List changed submission files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tojson keeps a newline or quote inside a file name visible, so it
          # fails the strict name pattern below instead of splitting a line.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename | tojson' \
            > "$RUNNER_TEMP/changed.txt"
          name='[A-Za-z0-9_-]+(\.[0-9]{2,})?\.jsonl\.b64'
          grep -E "^\"[A-Za-z0-9_-]{43}/submissions/$name\"\$" \
            "$RUNNER_TEMP/changed.txt" | tr -d '"' > "$RUNNER_TEMP/submitted.txt" || true
          if grep -E 'submissions/.*jsonl\.b64"$' "$RUNNER_TEMP/changed.txt" |
              grep -vE "^\"[A-Za-z0-9_-]{43}/submissions/$name\"\$"; then
            echo "submission file names may only use letters, digits, '-' and '_'" >&2
            exit 1
          fi
          sort -u "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          sort -V "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          multi=$(sed -E 's/(\.[0-9]+)?\.jsonl\.b64$//' "$RUNNER_TEMP/submitted.txt" |
            sort -u | cut -d/ -f1 | uniq -d)
          if [[ -n "$multi" ]]; then
            echo "more than one submission name in room(s): $multi" >&2
            exit 1
          fi
      - run: pip install orjson==3.11.3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/rezzy
          ref: ${{ env.REZZY_SHA }}
          path: rezzy
          persist-credentials: false
      - name: Build librezzy_ffi from the pinned commit
        run: |
          set -euo pipefail
          test "$(git -C rezzy rev-parse HEAD)" = "$REZZY_SHA"
          test -z "$(git -C rezzy status --porcelain)"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          (cd rezzy && RUSTUP_TOOLCHAIN=1.88.0 cargo build --release --locked -p rezzy-ffi)
          echo "REZZY_LIB=$GITHUB_WORKSPACE/rezzy/target/release/librezzy_ffi.so" >> "$GITHUB_ENV"
      - name: Validate submissions with trusted code
        run: |
          shopt -s nullglob
          # The API lookup has already run in its own token-scoped step.
          last_submission=
          while IFS= read -r s; do
            room=${s%%/*}
            file=${s##*/}
            logical=${file%.jsonl.b64}
            if [[ "$logical" =~ ^(.+)\.[0-9]{2,}$ ]]; then
              logical=${BASH_REMATCH[1]}
            fi
            submission_key="$room/$logical"
            if [[ "$submission_key" == "$last_submission" ]]; then
              continue
            fi
            last_submission=$submission_key
            prior_file="$RUNNER_TEMP/prior-$room.txt"
            if [[ ! -f "$prior_file" ]]; then
              : > "$prior_file"
              for d in trusted/"$room"/deltas/*.delta.jsonl.b64; do
                printf '%s\n' "$d" >> "$prior_file"
              done
            fi
            prior_args=()
            while IFS= read -r d; do
              if [[ -n "$d" ]]; then
                prior_args+=(--prior-delta "$d")
              fi
            done < "$prior_file"
            if [[ ! -s "$prior_file" ]]; then
              prior_args+=(--no-prior-deltas)
            fi
            # Use only listed encoded parts. Never let iter_lines discover an
            # unlisted plaintext or encoded sibling in the PR checkout.
            safe_input="$RUNNER_TEMP/claim-input"
            mkdir -p "$safe_input/$room/submissions"
            while IFS= read -r part; do
              [[ "${part%%/*}" == "$room" ]] || continue
              part_name=${part##*/}
              [[ "$part_name" == "$logical.jsonl.b64" ||
                 "$part_name" == "$logical".*.jsonl.b64 ]] || continue
              if [[ -L "$room" || -L "$room/submissions" || -L "$part" ||
                    ! -f "$part" ]]; then
                echo "$part: expected a regular, non-symlink submission part" >&2
                exit 1
              fi
              mkdir -p "$safe_input/${part%/*}"
              cp -- "$part" "$safe_input/$part"
            done < "$RUNNER_TEMP/submitted.txt"
            output=$(python3 -I trusted/scripts/bounty.py build \
              "$safe_input/$room/submissions/$logical.jsonl" "${prior_args[@]}")
            printf '%s\n' "$output"
            delta=${output##* -> }
            printf '%s\n' "$delta" >> "$prior_file"
          done < "$RUNNER_TEMP/submitted.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-submission
          path: "*/submissions/"
          retention-days: 14

  discover-same-repo-submission:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      submitted: ${{ steps.list.outputs.submitted }}
    steps:
      - id: list
        name: Find changed submission files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tojson keeps a newline or quote inside a file name visible, so it
          # fails the strict name pattern below instead of splitting a line.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename | tojson' \
            > "$RUNNER_TEMP/changed.txt"
          name='[A-Za-z0-9_-]+(\.[0-9]{2,})?\.jsonl\.b64'
          grep -E "^\"[A-Za-z0-9_-]{43}/submissions/$name\"\$" \
            "$RUNNER_TEMP/changed.txt" | tr -d '"' > "$RUNNER_TEMP/submitted.txt" || true
          if grep -E 'submissions/.*jsonl\.b64"$' "$RUNNER_TEMP/changed.txt" |
              grep -vE "^\"[A-Za-z0-9_-]{43}/submissions/$name\"\$"; then
            echo "submission file names may only use letters, digits, '-' and '_'" >&2
            exit 1
          fi
          # -V orders numbered parts numerically (.11 before .100).
          sort -u "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          sort -V "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          # One logical submission per room: numbered parts of a single name.
          multi=$(sed -E 's/(\.[0-9]+)?\.jsonl\.b64$//' "$RUNNER_TEMP/submitted.txt" |
            sort -u | cut -d/ -f1 | uniq -d)
          if [[ -n "$multi" ]]; then
            echo "more than one submission name in room(s): $multi" >&2
            exit 1
          fi

          printf 'submitted=%s\n' "$(jq -Rsc 'split("\n")[:-1]' "$RUNNER_TEMP/submitted.txt")" \
            >> "$GITHUB_OUTPUT"

  build-same-repo-submission:
    needs: discover-same-repo-submission
    if: >-
      needs.discover-same-repo-submission.result == 'success' &&
      needs.discover-same-repo-submission.outputs.submitted != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: trusted/res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/rezzy
          ref: ${{ env.REZZY_SHA }}
          path: rezzy
          persist-credentials: false
      - name: Build librezzy_ffi from the pinned commit
        run: |
          set -euo pipefail
          test "$(git -C rezzy rev-parse HEAD)" = "$REZZY_SHA"
          test -z "$(git -C rezzy status --porcelain)"
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          (cd rezzy && RUSTUP_TOOLCHAIN=1.88.0 cargo build --release --locked -p rezzy-ffi)
          echo "REZZY_LIB=$GITHUB_WORKSPACE/rezzy/target/release/librezzy_ffi.so" >> "$GITHUB_ENV"
      - name: Build deltas with trusted code and read-only credentials
        env:
          SUBMITTED_JSON:
            ${{ needs.discover-same-repo-submission.outputs.submitted }}
        run: |
          set -euo pipefail
          # An empty deltas/ must expand to nothing, not to the literal glob.
          shopt -s nullglob
          printf '%s' "$SUBMITTED_JSON" | jq -r '.[]' > "$RUNNER_TEMP/submitted.txt"
          sort -V "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          last_submission=
          : > "$RUNNER_TEMP/generated-deltas.txt"
          mkdir -p "$RUNNER_TEMP/raw-submission"
          cd trusted
          while IFS= read -r s; do
            room=${s%%/*}
            file=${s##*/}
            logical=${file%.jsonl.b64}
            if [[ "$logical" =~ ^(.+)\.[0-9]{2,}$ ]]; then
              logical=${BASH_REMATCH[1]}
            fi
            submission_key="$room/$logical"
            if [[ "$submission_key" == "$last_submission" ]]; then
              continue
            fi
            last_submission=$submission_key

            # Build from a clean directory containing only listed encoded
            # parts, never from implicit workspace siblings.
            safe_input="$RUNNER_TEMP/claim-input"
            mkdir -p "$safe_input/$room/submissions"
            while IFS= read -r part; do
              [[ "${part%%/*}" == "$room" ]] || continue
              part_name=${part##*/}
              [[ "$part_name" == "$logical.jsonl.b64" ||
                 "$part_name" == "$logical".*.jsonl.b64 ]] || continue
              source="../work/$part"
              if [[ -L "../work/$room" || -L "../work/$room/submissions" ||
                    -L "$source" || ! -f "$source" ]]; then
                echo "$source: expected a regular, non-symlink submission part" >&2
                exit 1
              fi
              mkdir -p "$safe_input/${part%/*}"
              cp -- "$source" "$safe_input/$part"
              mkdir -p "$RUNNER_TEMP/raw-submission/${part%/*}"
              cp -- "$source" "$RUNNER_TEMP/raw-submission/$part"
            done < "$RUNNER_TEMP/submitted.txt"

            prior_file="$RUNNER_TEMP/prior-$room.txt"
            if [[ ! -f "$prior_file" ]]; then
              : > "$prior_file"
              for d in "$room"/deltas/*.delta.jsonl.b64; do
                printf '%s\n' "$d" >> "$prior_file"
              done
            fi
            prior_args=()
            while IFS= read -r d; do
              [[ -z "$d" ]] || prior_args+=(--prior-delta "$d")
            done < "$prior_file"
            [[ -s "$prior_file" ]] || prior_args+=(--no-prior-deltas)
            output=$(python3 -I scripts/bounty.py build \
              "$safe_input/$room/submissions/$logical.jsonl" "${prior_args[@]}")
            printf '%s\n' "$output"
            delta=${output##* -> }
            printf '%s\n' "$delta" >> "$RUNNER_TEMP/generated-deltas.txt"
          done < "$RUNNER_TEMP/submitted.txt"
          mkdir -p "$RUNNER_TEMP/generated"
          while IFS= read -r delta; do
            room=${delta%%/*}
            mkdir -p "$RUNNER_TEMP/generated/$room/deltas"
            cp -- "$delta" "$RUNNER_TEMP/generated/$room/deltas/"
            cp -- "${delta%.delta.jsonl.b64}.claim.json" \
              "$RUNNER_TEMP/generated/$room/deltas/"
          done < "$RUNNER_TEMP/generated-deltas.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-claim-deltas
          path: ${{ runner.temp }}/generated/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-submission
          path: ${{ runner.temp }}/raw-submission/
          if-no-files-found: error
          retention-days: 14

  push-same-repo-delta:
    needs: [discover-same-repo-submission, build-same-repo-submission]
    if: >-
      needs.discover-same-repo-submission.result == 'success' &&
      needs.discover-same-repo-submission.outputs.submitted != '[]' &&
      needs.build-same-repo-submission.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: generated-claim-deltas
          path: generated
      - name: Replace submission with generated delta
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SUBMITTED_JSON:
            ${{ needs.discover-same-repo-submission.outputs.submitted }}
        run: |
          set -euo pipefail
          printf '%s' "$SUBMITTED_JSON" | jq -r '.[]' > "$RUNNER_TEMP/submitted.txt"
          while IFS= read -r s; do git rm -q -- "$s"; done \
            < "$RUNNER_TEMP/submitted.txt"
          for room_dir in ../generated/*; do
            room=${room_dir##*/}
            [[ "$room" =~ ^[A-Za-z0-9_-]{43}$ ]] || {
              echo "unexpected generated room path: $room" >&2
              exit 1
            }
            if [[ -L "$room" || -L "$room/deltas" ]]; then
              echo "$room/deltas: refusing symlink destination" >&2
              exit 1
            fi
            mkdir -p "$room/deltas"
            for delta in "$room_dir"/deltas/*; do
              [[ -f "$delta" && ! -L "$delta" ]] || {
                echo "$delta: expected a regular generated file" >&2
                exit 1
              }
              target="$room/deltas/${delta##*/}"
              [[ ! -L "$target" ]] || {
                echo "$target: refusing symlink destination" >&2
                exit 1
              }
              cp -- "$delta" "$target"
              git add -- "$target"
            done
          done
          if ! git diff --cached --quiet; then
            git -c user.name=claim-bot -c user.email=bot@invalid \
              commit -qm "Replace submission with delta"
            git remote set-url origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi
