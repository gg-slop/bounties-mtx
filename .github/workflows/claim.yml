name: claim
on:
  pull_request:
    paths: ["*/submissions/*.jsonl.b64"]
  pull_request_target:
    paths: ["*/submissions/*.jsonl.b64"]
permissions: {}
jobs:
  validate-fork-or-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - name: Validate submissions with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename
              | select(test("^[A-Za-z0-9_-]{43}/submissions/[^/]+\\.jsonl\\.b64$"))' \
            > "$RUNNER_TEMP/submitted.txt"
          sort -u "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          while IFS= read -r s; do
            room=${s%%/*}
            prior_file="$RUNNER_TEMP/prior-$room.txt"
            if [[ ! -f "$prior_file" ]]; then
              : > "$prior_file"
              for d in trusted/"$room"/deltas/*.delta.jsonl.b64; do
                printf '%s\n' "$d" >> "$prior_file"
              done
            fi
            prior_args=()
            while IFS= read -r d; do
              if [[ -n "$d" ]]; then
                prior_args+=(--prior-delta "$d")
              fi
            done < "$prior_file"
            if [[ ! -s "$prior_file" ]]; then
              prior_args+=(--no-prior-deltas)
            fi
            output=$(python3 -I trusted/scripts/bounty.py build \
              "$s" "${prior_args[@]}")
            printf '%s\n' "$output"
            delta=${output##* -> }
            printf '%s\n' "$delta" >> "$prior_file"
          done < "$RUNNER_TEMP/submitted.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-submission
          path: "*/submissions/"
          retention-days: 14

  replace-same-repo-submission:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: work/res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - name: Build and replace using trusted code
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          shopt -s nullglob
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename
              | select(test("^[A-Za-z0-9_-]{43}/submissions/[^/]+\\.jsonl\\.b64$"))' \
            > "$RUNNER_TEMP/submitted.txt"
          sort -u "$RUNNER_TEMP/submitted.txt" -o "$RUNNER_TEMP/submitted.txt"
          while IFS= read -r s; do
            room=${s%%/*}
            prior_file="$RUNNER_TEMP/prior-$room.txt"
            if [[ ! -f "$prior_file" ]]; then
              : > "$prior_file"
              for d in ../trusted/"$room"/deltas/*.delta.jsonl.b64; do
                printf '%s\n' "$d" >> "$prior_file"
              done
            fi
            prior_args=()
            while IFS= read -r d; do
              if [[ -n "$d" ]]; then
                prior_args+=(--prior-delta "$d")
              fi
            done < "$prior_file"
            if [[ ! -s "$prior_file" ]]; then
              prior_args+=(--no-prior-deltas)
            fi
            output=$(python3 -I ../trusted/scripts/bounty.py build \
              "$s" "${prior_args[@]}")
            printf '%s\n' "$output"
            delta=${output##* -> }
            printf '%s\n' "$delta" >> "$prior_file"
          done < "$RUNNER_TEMP/submitted.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-submission
          path: "work/*/submissions/"
          retention-days: 14
      - name: Replace submission with generated delta
        working-directory: work
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          while IFS= read -r s; do git rm -q -- "$s"; done \
            < "$RUNNER_TEMP/submitted.txt"
          git add -- '*/deltas/*'
          if ! git diff --cached --quiet; then
            git -c user.name=claim-bot -c user.email=bot@invalid \
              commit -qm "Replace submission with delta"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi
