name: bounty-merge
on:
  push:
    branches: [main]
    paths: ["deltas/*/*.claim.json"]
concurrency: bounty-ledger # serialize ledger writes
permissions:
  contents: write
  pull-requests: read
jobs:
  award:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/checkout@v4 # base DAGs live in the data repo
        with: { repository: gamesguru/bounties-mtx-res, path: res }
      - run: pip install orjson==3.11.3
      - name: Award newly merged claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Room and base DAG come from the claim's path and its recorded base.
          PR=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number')
          WHO=$(gh pr view "$PR" --json author --jq .author.login)
          for c in $(git diff --name-only --diff-filter=A HEAD~1 -- 'deltas/*/*.claim.json'); do
            python3 -I tools/bounty.py merge "$c" --pr "$PR" --claimant "$WHO"
          done
      - run: |
          git add bounty/*/ledger.jsonl
          git diff --cached --quiet || {
            git -c user.name=claim-bot -c user.email=bot@invalid commit -qm "ledger"
            git push
          }
