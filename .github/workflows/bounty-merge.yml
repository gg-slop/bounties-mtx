name: bounty-merge
on:
  push:
    branches: [master]
    paths: ["*/deltas/*.claim.json"]
concurrency:
  group: bounty-ledger
  cancel-in-progress: false
permissions: {}
jobs:
  award:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gamesguru/bounties-mtx-res
          path: res
          persist-credentials: false
      - run: pip install orjson==3.11.3
      - name: Reconcile claims in merge order
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin "$PUSH_BEFORE"
          # Keep the full push range for audit and recover every claim on master
          # so an older canceled/pending run is reconciled by the next run.
          git diff --name-only --diff-filter=A "$PUSH_BEFORE" "$PUSH_SHA" \
            -- '*/deltas/*.claim.json' > "$RUNNER_TEMP/pushed-claims.txt"
          git log --first-parent --reverse --diff-filter=A \
            --format='COMMIT%x09%H' --name-only -- '*/deltas/*.claim.json' |
            awk -F '\t' '
              /^COMMIT\t/ { commit = $2; next }
              /^[A-Za-z0-9_-]+\/deltas\/[0-9a-f]+\.claim\.json$/ {
                print commit "\t" $0
              }
            ' > "$RUNNER_TEMP/claim-history.txt"
          : > "$RUNNER_TEMP/claim-errors.txt"
          while IFS=$'\t' read -r added_at claim; do
            [[ -f "$claim" ]] || continue
            room=${claim%%/*}
            delta=${claim%.claim.json}.delta.jsonl.b64
            prior_file="$RUNNER_TEMP/prior-$room.txt"
            prior_args=()
            if [[ -f "$prior_file" ]]; then
              while IFS= read -r prior_delta; do
                prior_args+=(--prior-delta "$prior_delta")
              done < "$prior_file"
            fi
            if ! prs=$(gh api "repos/$REPOSITORY/commits/$added_at/pulls"); then
              echo "$claim: could not resolve PR for $added_at" \
                | tee -a "$RUNNER_TEMP/claim-errors.txt"
              continue
            fi
            pr=$(printf '%s' "$prs" | jq -r \
              '[.[] | select(.base.ref == "master")][0].number // empty')
            if [[ -z "$pr" ]]; then
              echo "$claim: no associated master PR for addition commit $added_at" \
                | tee -a "$RUNNER_TEMP/claim-errors.txt"
              continue
            fi
            if ! who=$(gh pr view "$pr" --repo "$REPOSITORY" \
              --json author --jq .author.login); then
              echo "$claim: could not resolve claimant for PR #$pr" \
                | tee -a "$RUNNER_TEMP/claim-errors.txt"
              continue
            fi
            trusted_targets="$RUNNER_TEMP/targets-$room.json"
            if ! git show "$PUSH_BEFORE:$room/targets.json" > "$trusted_targets"; then
              echo "$claim: no published target table before this push" \
                | tee -a "$RUNNER_TEMP/claim-errors.txt"
              continue
            fi
            if python3 -I scripts/bounty.py merge "$claim" --pr "$pr" \
              --claimant "$who" --trusted-targets "$trusted_targets" \
              "${prior_args[@]}"; then
              printf '%s\n' "$delta" >> "$prior_file"
            else
              echo "$claim: merge validation failed" \
                | tee -a "$RUNNER_TEMP/claim-errors.txt"
            fi
          done < "$RUNNER_TEMP/claim-history.txt"
      - name: Commit and push ledger updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for ledger in */ledger.jsonl; do
            git add -- "$ledger"
          done
          if ! git diff --cached --quiet; then
            git -c user.name=claim-bot -c user.email=bot@invalid \
              commit -qm "Record bounty awards"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:refs/heads/master; then
                pushed=true
                break
              fi
              git rebase --abort || true
            done
            if [[ "$pushed" != true ]]; then
              echo "could not push ledger after three fetch/rebase attempts" >&2
              exit 1
            fi
          fi
      - name: Report invalid claims after persisting valid awards
        if: always()
        run: |
          if [[ -s "$RUNNER_TEMP/claim-errors.txt" ]]; then
            cat "$RUNNER_TEMP/claim-errors.txt"
            exit 1
          fi
